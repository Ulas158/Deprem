[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deprem"
version = "0.1.0"
description = "Türkiye sismisite ve fay moment bütçesi araştırma prototipi"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "requests>=2.28",
    "cutde>=23.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Katalog dışı gözlemler: InSAR GeoTIFF okuma, dalga biçimi (dv/v), PhaseNet
obs = ["rasterio>=1.3", "obspy>=1.4", "seisbench>=0.7"]
# Parametre araması (Bayesçi optimizasyon)
search = ["optuna>=3.0"]
# Depremden depreme, fay fay öğrenen model (otomatik türev)
walk = ["jax>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
